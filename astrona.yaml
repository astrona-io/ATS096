        path: sections/section-020/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: dependencies
        task_kind: build
        tags: [depends-on, wait, health-checks, staged-rollout, kustomization, timeout]
        learning_goals:
          - Order an infrastructure stage, a staging stage and a production stage with dependsOn
          - Gate each stage with a health check so Ready means the workload runs
          - Prove the pipeline with three Ready stages and both copies of podinfo answering
        resources:
          - name: "Kustomization API: dependencies"
            url: https://fluxcd.io/flux/components/kustomize/kustomizations/#dependencies
