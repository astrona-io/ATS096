        title: "The Flux Kustomization And Kustomize"
        path: sections/section-010/module-01/course-01-flux-kustomization-and-kustomize.md
      - type: reading
        title: "Target Namespaces And Patches"
        path: sections/section-010/module-01/course-02-target-namespaces-and-patches.md
      - type: reading
        title: "Variable Substitution After The Build"
        path: sections/section-010/module-01/course-03-variable-substitution.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Deploy One Base To Two Environments Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 20m
        topic: kustomize-build
        task_kind: build
        tags: [kustomization, target-namespace, patches, post-build-substitution, flux-get]
        learning_goals:
          - Deploy one base folder twice with two Flux Kustomizations and two target namespaces
          - Set the replica count with a patch and the message and label with post-build substitution
          - Prove each environment with a ready Deployment and a request that returns its own message
        resources:
          - name: "Kustomization API"
            url: https://fluxcd.io/flux/components/kustomize/kustomizations/
          - name: "flux build kustomization"
            url: https://fluxcd.io/flux/cmd/flux_build_kustomization/
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Repair The Overlays Of Two Environments Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: kustomize-build
        task_kind: troubleshooting
        tags: [kustomization, target-namespace, patches, substitute-from, flux-build, flux-events]
        learning_goals:
          - Find a missing namespace, a missing variable source and a patch that matches nothing
          - Fix the two Flux Kustomizations without making a variable source optional
          - Prove each environment with its message and its replica count
        resources:
