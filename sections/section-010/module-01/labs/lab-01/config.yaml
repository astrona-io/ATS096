# Deploy One Base To Two Environments
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-096-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite, the Flux controllers and the fleet source"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-096-lab-010-01-setup"
      description: "Checks that no Flux Kustomization exists yet; the task creates them"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-kustomizations"
      description: "Confirms podinfo-staging and podinfo-production build ./apps/podinfo/base into their own namespaces, prune, and are Ready"
      type: "file"
      source: "validation/validate-kustomizations.sh"
    - name: "validate-staging"
      description: "Confirms staging runs 1 ready replica labelled environment=staging and answers with the message staging"
      type: "file"
      source: "validation/validate-staging.sh"
    - name: "validate-production"
      description: "Confirms production runs 2 ready replicas labelled environment=production and answers with the message production"
      type: "file"
      source: "validation/validate-production.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
