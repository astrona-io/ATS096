# Repair A Build That Uses Replacements
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-096-lab-010-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite, the Flux controllers and the fleet source"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-096-lab-010-03-setup"
      description: "Applies the Flux Kustomization podinfo-staging, which has a wrong path and an overlay with a broken replacement; it does not wait for Ready"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-kustomization"
      description: "Confirms podinfo-staging builds ./apps/podinfo/overlay into podinfo-staging, prunes, is not suspended, has no postBuild or patches, and is Ready"
      type: "file"
      source: "validation/validate-kustomization.sh"
    - name: "validate-replacement"
      description: "Confirms the overlay in Git still uses a replacement that reads data.message and that the Deployment env has the replaced value"
      type: "file"
      source: "validation/validate-replacement.sh"
    - name: "validate-workload"
      description: "Confirms podinfo in podinfo-staging has 1 ready replica applied by Flux and answers with the message from-replacement"
      type: "file"
      source: "validation/validate-workload.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
