apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - settings.yaml
replacements:
  - source:
      kind: ConfigMap
      name: podinfo-settings
      fieldPath: data.message
    targets:
      - select:
          kind: Deployment
          name: podinfo
        fieldPaths:
          - spec.template.spec.containers.[name=podinfo].env.[name=PODINFO_UI_MESSAGE].value
