# Build A Staged Pipeline From Staging To Production
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-096-lab-020-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite, the Flux controllers and the fleet source"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-096-lab-020-01-setup"
      description: "Checks that no Flux Kustomization exists yet; the task creates the pipeline"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-dependencies"
      description: "Confirms apps-staging depends on infrastructure and apps-production depends on apps-staging"
      type: "file"
      source: "validation/validate-dependencies.sh"
    - name: "validate-health-gates"
      description: "Confirms every stage is health-checked: wait true, or a health check on its Deployment"
      type: "file"
      source: "validation/validate-health-gates.sh"
    - name: "validate-pipeline-ready"
      description: "Confirms all three stages are Ready and redis and both podinfo copies answer as expected"
      type: "file"
      source: "validation/validate-pipeline-ready.sh"

teardown:
  keepCluster: false
