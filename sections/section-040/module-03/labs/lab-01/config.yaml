# Move An Object Between Stages Without Recreating It
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-096-lab-040-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite, the Flux controllers and the fleet source"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-096-lab-040-03-setup"
      description: "Applies the Flux Kustomization objects team-a and team-b and saves the UID of shared-settings"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-git-moved"
      description: "Confirms Git holds shared-settings under apps/team-b and no longer under apps/team-a"
      type: "file"
      source: "validation/validate-git-moved.sh"
    - name: "validate-same-object"
      description: "Confirms shared-settings is owned by team-b, kept its original UID, and both stages are Ready"
      type: "file"
      source: "validation/validate-same-object.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
