# Let An Autoscaler Own Replicas In A Helm Release
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-096-lab-040-04"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite, the Flux controllers and the fleet source"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-096-lab-040-04-setup"
      description: "Installs podinfo in podinfo-production with a HelmRelease that corrects drift in every field"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-ignore-rule"
      description: "Confirms drift detection is enabled and the only ignore rule covers the replicas of the Deployment"
      type: "file"
      source: "validation/validate-ignore-rule.sh"
    - name: "validate-replicas-kept"
      description: "Sets 4 replicas as another field manager, reconciles, and confirms helm-controller leaves them"
      type: "file"
      source: "validation/validate-replicas-kept.sh"
    - name: "validate-other-drift-corrected"
      description: "Changes the CPU request by hand, reconciles, and confirms helm-controller puts the chart value back"
      type: "file"
      source: "validation/validate-other-drift-corrected.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
