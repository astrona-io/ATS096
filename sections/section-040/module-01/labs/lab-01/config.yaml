# Make Helm Correct Drift Without Touching Tuned Fields
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-096-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite, the Flux controllers and the fleet source"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-096-lab-040-01-setup"
      description: "Installs podinfo in podinfo-production with a HelmRelease without drift detection, then tunes its CPU request by hand"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-drift-config"
      description: "Confirms drift detection is enabled and ignores only the container resources of the Deployment"
      type: "file"
      source: "validation/validate-drift-config.sh"
    - name: "validate-scale-reverted"
      description: "Scales podinfo to 5 by hand, reconciles, and confirms helm-controller puts it back to 2"
      type: "file"
      source: "validation/validate-scale-reverted.sh"
    - name: "validate-tuned-field-kept"
      description: "Confirms the hand-tuned CPU request of 50m survives a reconciliation"
      type: "file"
      source: "validation/validate-tuned-field-kept.sh"

teardown:
  keepCluster: false
