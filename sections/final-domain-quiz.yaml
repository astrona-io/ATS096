  explanation: Correct. It falls back to interval.
- id: ats096-final-q22
  type: single_choice
  difficulty: intermediate
  learning_objective: Know what a request writes
  source_readings:
  - sections/section-020/module-03/course-03-requesting-a-reconciliation.md
  prompt: Which annotation does `flux reconcile` write to request a run?
  options:
  - id: a
    text: "`fluxcd.io/reconcile`"
    explanation: Not correct. That name is not used.
  - id: b
    text: "`kustomize.toolkit.fluxcd.io/force`"
    explanation: Not correct. That annotation does something else.
  - id: c
    text: "`reconcile.fluxcd.io/requestedAt`"
    explanation: Correct. This annotation is copied to the status when handled.
  - id: d
    text: "`reconcile.fluxcd.io/interval`"
    explanation: Not correct. The interval is a spec field.
  correct_option: c
  explanation: Correct. This annotation is copied to the status when handled.
- id: ats096-final-q23
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the bridge between kinds
  source_readings:
  - sections/section-020/module-04/course-01-the-problem-of-order-across-kinds.md
  prompt: What lets a Kustomization wait for a chart that a HelmRelease installs?
  options:
  - id: a
    text: "`dependsOn` pointing at the HelmRelease."
    explanation: Not correct. Kinds do not match.
  - id: b
    text: A longer `interval`.
    explanation: Not correct. Interval is not a gate.
  - id: c
    text: "`prune: true`."
    explanation: Not correct. Prune does not wait.
  - id: d
    text: "`wait: true` on the Kustomization that applies the HelmRelease."
    explanation: Correct. Health makes the HelmRelease gate the stage.
  correct_option: d
  explanation: Correct. Health makes the HelmRelease gate the stage.
- id: ats096-final-q24
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose a level
  source_readings:
  - sections/section-020/module-04/course-03-ordering-helmrelease-objects.md
  prompt: When is stage ordering a better fit than release ordering?
  options:
  - id: a
    text: For two Pods in one chart.
    explanation: Not correct. That is Kubernetes, not Flux.
  - id: b
    text: For ordering hooks.
    explanation: Not correct. Hooks are a Helm feature.
  - id: c
    text: For the big picture, such as infrastructure before apps.
    explanation: Correct. Stages order whole folders.
  - id: d
    text: For ordering commits.
    explanation: Not correct. Commits are not ordered by Flux.
  correct_option: c
  explanation: Correct. Stages order whole folders.
- id: ats096-final-q25
  type: single_choice
  difficulty: intermediate
  learning_objective: Find the right namespace
  source_readings:
  - sections/section-030/module-02/course-01-the-helmchart-between-source-and-release.md
  prompt: Where does the `HelmChart` of the release `podinfo` in `podinfo-staging`
