- id: ats096-final-q20
  type: single_choice
  difficulty: intermediate
  learning_objective: Protect against missing fields
  source_readings:
  - sections/section-020/module-02/course-02-writing-healthcheckexprs.md
  prompt: Why does the expression start with `has(status.phase)`?
  options:
  - id: a
    text: It makes the expression faster.
    explanation: Not correct. It is about correctness.
  - id: b
    text: It converts the value to a string.
    explanation: Not correct. It returns true or false.
  - id: c
    text: Reading a field that does not exist is an error in CEL, and `has()` avoids
      it.
    explanation: Correct. has() tests for the field first.
  - id: d
    text: It subscribes to status changes.
    explanation: Not correct. CEL has no subscriptions.
  correct_option: c
  explanation: Correct. has() tests for the field first.
- id: ats096-final-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain retryInterval
  source_readings:
  - sections/section-020/module-03/course-01-interval-timeout-and-retry.md
  prompt: Which value does `retryInterval` use when it is not set?
  options:
  - id: a
    text: 30 seconds.
    explanation: Not correct. There is no fixed default of 30 seconds.
  - id: b
    text: Zero, so it retries at once.
    explanation: Not correct. It does not retry in a tight loop.
  - id: c
    text: The value of `timeout`.
    explanation: Not correct. timeout is a different field.
  - id: d
    text: The value of `interval`.
    explanation: Correct. It falls back to interval.
