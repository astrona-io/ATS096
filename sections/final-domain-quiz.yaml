  - id: b
    text: In `kube-system`.
    explanation: Not correct. Flux does not use it.
  - id: c
    text: It is not an object.
    explanation: Not correct. It is an object.
  - id: d
    text: In `podinfo-staging`, named `podinfo-staging-podinfo`.
