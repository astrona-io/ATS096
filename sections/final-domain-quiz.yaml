- id: ats096-final-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: Find the namespace of the ServiceAccount
  source_readings:
  - sections/section-010/module-04/course-02-impersonate-a-service-account.md
  prompt: In which namespace must the ServiceAccount named in `serviceAccountName`
