# Knowledge check for module 02 of section 030. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats096-030-m02
course_id: ATS096
exam_code: FLUX
status: alpha
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: module
  id: module-02
  title: Choose And Pin Chart Sources
placement:
  position: after
  reading: sections/section-030/module-02/course-05-summary.md
questions:
- id: ats096-030-m02-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the HelmChart
  source_readings:
  - sections/section-030/module-02/course-01-the-helmchart-between-source-and-release.md
  prompt: Which object sits between a `HelmRepository` and a `HelmRelease`?
  options:
  - id: a
    text: A `HelmChart`, created for the release and owned by source-controller.
    explanation: Correct. The HelmChart describes one chart to source-controller.
  - id: b
    text: A `HelmPackage`, created by helm-controller.
    explanation: Not correct. No such kind exists.
  - id: c
    text: A `Secret` with the chart archive.
    explanation: Not correct. The artifact is stored by source-controller.
  - id: d
    text: A `ConfigMap` of values.
    explanation: Not correct. Values are a different matter.
  correct_option: a
  explanation: Correct. The HelmChart describes one chart to source-controller.
- id: ats096-030-m02-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Find the right namespace
  source_readings:
  - sections/section-030/module-02/course-01-the-helmchart-between-source-and-release.md
  prompt: Where does the `HelmChart` of the release `podinfo` in `podinfo-staging`
    live?
  options:
  - id: a
    text: In `flux-system`, named `podinfo`.
    explanation: Not correct. It lives with the release.
  - id: b
    text: In `kube-system`.
    explanation: Not correct. Flux does not use it.
  - id: c
    text: It is not an object.
    explanation: Not correct. It is an object.
  - id: d
    text: In `podinfo-staging`, named `podinfo-staging-podinfo`.
    explanation: Correct. It is in the namespace of the release.
  correct_option: d
  explanation: Correct. It is in the namespace of the release.
- id: ats096-030-m02-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Debug in order
  source_readings:
  - sections/section-030/module-02/course-01-the-helmchart-between-source-and-release.md
  prompt: A release does not install. What is the first check?
  options:
  - id: a
    text: The Pods of the chart.
    explanation: Not correct. They do not exist yet.
  - id: b
    text: The CoreDNS logs.
    explanation: Not correct. Unrelated.
  - id: c
    text: Whether the `HelmChart` is `Ready`.
    explanation: Correct. Without a chart there is nothing to install.
  - id: d
    text: The Git history.
    explanation: Not correct. The chart may not come from Git.
  correct_option: c
  explanation: Correct. Without a chart there is nothing to install.
- id: ats096-030-m02-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Read a range
  source_readings:
  - sections/section-030/module-02/course-02-versions-and-reconcile-strategy.md
  prompt: Which version does `~6.15.0` select?
  options:
  - id: a
    text: The highest `6.y.z` version.
    explanation: Not correct. That is `^6.0.0` or `6.x`.
  - id: b
    text: The highest `6.15.z` version.
    explanation: Correct. The tilde allows patch changes.
  - id: c
    text: Exactly `6.15.0`.
    explanation: Not correct. That is the exact form.
  - id: d
    text: The highest stable version of any major.
    explanation: Not correct. That is `*`.
  correct_option: b
  explanation: Correct. The tilde allows patch changes.
- id: ats096-030-m02-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the risk of a range
  source_readings:
  - sections/section-030/module-02/course-02-versions-and-reconcile-strategy.md
  prompt: 'What is the main risk of `version: 6.x` in production?'
  options:
  - id: a
    text: The cluster can upgrade without a commit in Git.
    explanation: Correct. The chart changes while Git does not.
  - id: b
    text: The release is never installed.
    explanation: Not correct. It installs fine.
  - id: c
    text: The HelmRepository is deleted.
    explanation: Not correct. Nothing is deleted.
  - id: d
    text: The release is suspended.
    explanation: Not correct. Ranges do not suspend.
  correct_option: a
  explanation: Correct. The chart changes while Git does not.
- id: ats096-030-m02-q06
  type: single_choice
  difficulty: beginner
  learning_objective: Choose the strategy
  source_readings:
  - sections/section-030/module-02/course-02-versions-and-reconcile-strategy.md
  prompt: Which reconcile strategy makes a new artifact for every new commit of a
    Git source?
  options:
  - id: a
    text: "`ChartVersion`"
    explanation: Not correct. It follows only the version in Chart.yaml.
  - id: b
    text: "`Always`"
    explanation: Not correct. No such value.
  - id: c
    text: "`Commit`"
    explanation: Not correct. No such value.
  - id: d
    text: "`Revision`"
    explanation: Correct. Revision follows the revision of the source.
  correct_option: d
  explanation: Correct. Revision follows the revision of the source.
- id: ats096-030-m02-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Write a Git chart reference
  source_readings:
  - sections/section-030/module-02/course-03-charts-from-git.md
  prompt: How does a `HelmRelease` point at the chart folder `charts/hello` in a `GitRepository`?
  options:
  - id: a
    text: "`chart: hello` with a `HelmRepository` sourceRef."
    explanation: Not correct. That names a chart repository chart.
  - id: b
    text: "`url: charts/hello`."
    explanation: Not correct. The release has no url field.
  - id: c
    text: "`chart: ./charts/hello` with a `sourceRef` of kind `GitRepository`."
    explanation: Correct. Git charts use a path.
  - id: d
    text: "`path: ./charts/hello` in the GitRepository."
    explanation: Not correct. The path belongs to the release.
  correct_option: c
  explanation: Correct. Git charts use a path.
- id: ats096-030-m02-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Order values files
  source_readings:
  - sections/section-030/module-02/course-03-charts-from-git.md
  prompt: Two files in `valuesFiles` set the same key. Which one wins?
  options:
  - id: a
    text: The first file.
    explanation: Not correct. Later files override earlier ones.
  - id: b
    text: The later file in the list.
    explanation: Correct. They are merged in order.
  - id: c
    text: The one with the shorter name.
    explanation: Not correct. Names do not matter.
  - id: d
    text: It is an error.
    explanation: Not correct. Overlaps are allowed.
  correct_option: b
  explanation: Correct. They are merged in order.
- id: ats096-030-m02-q09
  type: single_choice
  difficulty: beginner
  learning_objective: Verify a signature
  source_readings:
  - sections/section-030/module-02/course-04-verifying-and-authenticating-charts.md
  prompt: Which block of an `OCIRepository` makes source-controller check a cosign
    signature?
  options:
  - id: a
    text: "`verify` with `provider: cosign`."
    explanation: Correct. verify enables signature checking.
  - id: b
    text: "`secretRef`"
    explanation: Not correct. That holds credentials.
  - id: c
    text: "`layerSelector`"
    explanation: Not correct. That selects a layer.
  - id: d
    text: "`ref.digest`"
    explanation: Not correct. That pins a digest.
  correct_option: a
  explanation: Correct. verify enables signature checking.
- id: ats096-030-m02-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Give a source credentials
  source_readings:
  - sections/section-030/module-02/course-04-verifying-and-authenticating-charts.md
  prompt: Where must the Secret named in `spec.secretRef` of a `HelmRepository` live?
  options:
  - id: a
    text: In `flux-system`, always.
    explanation: Not correct. It follows the source.
  - id: b
    text: In `default`.
    explanation: Not correct. No special role.
  - id: c
    text: In the namespace of the HelmRelease, always.
    explanation: Not correct. It follows the source.
  - id: d
    text: In the namespace of the `HelmRepository`.
    explanation: Correct. Secrets are read from the namespace of the source.
  correct_option: d
  explanation: Correct. Secrets are read from the namespace of the source.
