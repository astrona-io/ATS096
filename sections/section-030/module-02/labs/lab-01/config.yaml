# Install A Chart From Git With A Values File
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-096-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the repository gitops/fleet, the CoreDNS rewrite, the Flux controllers and the fleet source"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-096-lab-030-02-setup"
      description: "Removes any HelmRelease from podinfo-staging so the task starts from an empty namespace"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-release-source"
      description: "Confirms the HelmRelease hello takes its chart from the GitRepository fleet at charts/hello with reconcileStrategy Revision and valuesFiles"
      type: "file"
      source: "validation/validate-release-source.sh"
    - name: "validate-release-ready"
      description: "Confirms hello is Ready and the ConfigMap hello-config in podinfo-staging holds the message staging"
      type: "file"
      source: "validation/validate-release-ready.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
